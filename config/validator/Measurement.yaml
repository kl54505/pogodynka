App\Entity\Measurement:
    properties:
        location:
            - NotNull:
                  groups: [create, edit]
        date:
            - NotNull:
                  groups: [create, edit]
            - GreaterThanOrEqual:
                  value: today
                  message: 'A new forecast cannot be dated in the past.'
                  groups: [create]
        celsius:
            - NotBlank:
                  groups: [create, edit]
            - Range:
                  min: -90
                  max: 60
                  groups: [create, edit]
        pressure:
            - NotBlank:
                  groups: [create, edit]
            - Range:
                  min: 870
                  max: 1085
                  groups: [create, edit]
        humidity:
            - NotBlank:
                  groups: [create, edit]
            - Range:
                  min: 0
                  max: 100
                  groups: [create, edit]
        windSpeed:
            - NotBlank:
                  groups: [create, edit]
            - PositiveOrZero:
                  groups: [create, edit]

